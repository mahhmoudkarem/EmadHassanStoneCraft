# /etc/nginx/sites-available/emadhassan
# غيّر emadhassanstonecraft.com للدومين بتاعك
# بعد كده: ln -s /etc/nginx/sites-available/emadhassan /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# وللـ SSL: certbot --nginx -d emadhassanstonecraft.com -d www.emadhassanstonecraft.com

server {
    listen 80;
    server_name emadhassanstonecraft.com www.emadhassanstonecraft.com;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
